# KATLAB TrackingMonitor - repo registry + server settings.
# Read ONCE at startup (F25: restart the server after changing this file).
# Adding a repo = add an entry below, restart. Zero code changes.
#
# PATH CONVENTION (R1, v0.1.1.0): the capture hook reads this file with a
# closed stdlib projection (not YAML) - root keys are only "server"/"repos";
# keep exactly one literal top-level "repos:" line, and every repo "path:"
# line MUST stay SINGLE-LINE
# and SINGLE-QUOTED, e.g.  path: 'X:\absolute\path'  (never folded/
# multi-line/flow style; never unquoted when the path contains #).
# This registry doubles as the hook's capture ALLOWLIST: only repos listed
# here are captured. Unreadable, invalid, or empty registry = fail-closed
# capture no-op; provider/editor execution still continues successfully.
# IDs must be normalized YAML strings matching [A-Za-z0-9_-]+. Quote values
# that YAML would otherwise type as a boolean, null, or number.

server:
  host: 127.0.0.1
  port: 8100
  status_poll_seconds: 30

repos:
  - id: EA_Dev
    name: "EA repo - Development Workspace"
    path: 'C:\Users\ADMIN\AppData\Roaming\MetaQuotes\Terminal\7ED840DDCFDDCD9E053E1BDBFEACD96A\MQL5\Experts\MQL5_SuperRepo'
    plan_globs:
      - "temp/*/PLAN_*.txt"

  - id: UM_Dev
