<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- v0.1.12.0 D2 (B.2): installable PWA — manifest + standalone
         title-bar color (#0f172a = the header's slate-900). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!-- A.1/D3: font pairing (Plus Jakarta Sans + Azeret Mono), display=swap;
         offline-safe — the Tailwind fallback stacks render if the CDN is
         unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style id="katlab-workbench-v2">
      /* Workbench 2.0: scoped presentation; existing data and interaction owners stay. */
      #root header.app-shell-header > .app-header-primary {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1rem;
      }
      #root header.app-shell-header > .app-header-primary > .app-header-actions {
        min-width: 0;
        justify-content: flex-start;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
      }
      #root header.app-shell-header > .app-workspace-context {
        padding: 0.75rem 0;
        border: 0;
        border-top: 1px solid rgb(var(--ui-border));
        border-radius: 0;
        background: transparent;
      }
      #root .app-shell-navigation {
        padding: 1.25rem 0.75rem;
        background: #0b1220;
      }
      #root .app-shell-navigation nav[aria-label="Primary views"] > div > button.ui-control[aria-current="page"] {
        background-color: rgb(var(--ui-primary));
      }
      #root .app-shell-navigation nav[aria-label="Primary views"] > div > button.ui-control[aria-current="page"]:hover:not(:disabled) {
        background-color: rgb(var(--ui-primary-hover));
      }
      #root #main-content {
        padding: 1rem;
        background: #060b16;
      }
      #root #main-content .ui-page-heading {
        padding-bottom: 1rem;
        border-bottom: 1px solid rgb(var(--ui-border));
      }
      #root #main-content > div > .max-w-\[100rem\] {
        padding: 0;
      }
      #root #main-content section[aria-labelledby="overview-now-heading"] {
        padding: 1rem;
        border-radius: 8px;
        background: rgb(var(--ui-surface));
      }
      #root #main-content section[aria-labelledby="overview-now-heading"] [role="group"][aria-label="Current operational metrics"] > .ui-metric:not(:first-child) {
        background: rgb(var(--ui-canvas));
      }
      #root #main-content section[aria-labelledby="overview-now-heading"] [role="group"][aria-label="Captured activity summary"] {
        padding: 1rem 0 0;
        border: 0;
        border-top: 1px solid rgb(var(--ui-border));
        border-radius: 0;
        background: transparent;
      }
      #root #main-content > div > .max-w-\[100rem\] > .ui-surface.border-l-4 {
        padding: 1.25rem;
        background: rgb(var(--ui-surface));
      }
      @media (min-width: 768px) {
        #root #main-content { padding: 1.5rem; }
        #root #main-content section[aria-labelledby="overview-now-heading"] { padding: 1.5rem; }
        #root #main-content > div > .max-w-\[100rem\] > .ui-surface.border-l-4 { padding: 1.5rem; }
      }
      @media (min-width: 1024px) {
        #root header.app-shell-header > .app-header-primary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        #root header.app-shell-header > .app-header-primary > .app-header-actions { justify-content: flex-end; }
      }
      @media (min-width: 1280px) {
        #root #main-content { padding: 2rem; }
      }
    </style>
    <style id="katlab-changes-review-desk">
      /* Changes Review Desk: captured-work hierarchy; existing behavior stays. */
      #root #main-content > div > .changes-workbench > .changes-command-deck {
        padding: 1.25rem;
        border: 1px solid rgb(var(--ui-border));
        border-radius: 8px;
        background: rgb(var(--ui-surface));
      }
      #root #main-content > div > .changes-workbench > .changes-command-deck > .changes-command-metric {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
      }
      #root #main-content > div > .changes-workbench[data-has-picks="true"] > .changes-command-deck > .changes-command-metric-action {
        padding-left: 1rem;
        border-left: 3px solid rgb(var(--ui-warning));
      }
      #root #main-content > div > .changes-workbench > .changes-command-deck > .changes-command-metric > dt {
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      #root #main-content > div > .changes-workbench > .changes-command-deck > .changes-command-metric > dd {
        font-size: 2.25rem;
        line-height: 1.25;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] > .ui-section-heading {
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid rgb(var(--ui-border));
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list {
        padding: 1.25rem;
        border-radius: 8px;
        background: rgb(var(--ui-surface));
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list > div.mt-4 > .ui-work-row {
        padding-left: 0;
        padding-right: 0;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > p {
        margin-top: 0.5rem;
        font-size: 0.875rem;
        line-height: 1.5;
      }
    </style>
    <style id="katlab-attribution-station">
      /* Attribution Station: queue hierarchy; existing assignment behavior stays. */
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] {
        padding: 1.25rem;
        border: 1px solid rgb(var(--ui-warning) / 0.5);
        border-radius: 8px;
        background: rgb(var(--ui-surface));
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > .ui-section-heading {
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid rgb(var(--ui-border));
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > fieldset {
        gap: 0.75rem;
        margin-bottom: 1.25rem;
        padding: 1rem;
        border: 1px solid rgb(var(--ui-border));
        border-radius: 8px;
        background: rgb(var(--ui-canvas));
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > fieldset > label {
        gap: 0.5rem;
        min-height: 44px;
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > fieldset > button {
        min-height: 44px;
        padding: 0.5rem 1rem;
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > fieldset > button[aria-haspopup="dialog"] {
        flex: 1 1 14rem;
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > .ui-work-row {
        align-items: center;
        gap: 0.75rem;
        margin-top: 0.75rem;
        padding: 1rem;
        border: 1px solid rgb(var(--ui-border));
        border-radius: 8px;
        background: rgb(var(--ui-canvas));
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > .ui-work-row > label {
        gap: 0.5rem;
        min-height: 44px;
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > .ui-work-row > span.font-mono {
        flex-basis: 100%;
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > .ui-work-row > button {
        min-height: 44px;
        padding: 0.5rem 1rem;
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > .ui-work-row > button[aria-haspopup="dialog"] {
        flex: 1 1 14rem;
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > fieldset > span.text-slate-400:not(.sr-only) {
        flex-basis: 100%;
        overflow-wrap: anywhere;
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > .ui-work-row > span.basis-full.text-xs.text-slate-400 {
        padding-top: 0.25rem;
        overflow-wrap: anywhere;
      }
      #root #main-content > div > .changes-workbench > #sec-pick > section[aria-label="Manual attribution queue"] > .ui-work-row > span.italic {
        flex-basis: 100%;
        padding: 0.75rem;
        border: 1px solid rgb(var(--ui-border));
        border-radius: 8px;
        background: rgb(var(--ui-surface));
        overflow-wrap: anywhere;
      }
    </style>
    <style id="katlab-diagnostic-studio">
      /* Diagnostic Studio: named snapshot sections; health behavior stays. */
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-server-heading"],
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-activity-heading"],
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-providers-heading"],
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-repositories-heading"] {
        padding: 1.25rem;
        border-radius: 8px;
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-server-heading"] > h3,
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-activity-heading"] > h3,
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-providers-heading"] > h3,
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-repositories-heading"] > h3 {
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid rgb(var(--ui-border));
        font-size: 1.25rem;
        line-height: 1.4;
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-server-heading"] > div.grid {
        padding-top: 0.375rem;
        padding-bottom: 0.375rem;
        border-bottom: 1px solid rgb(var(--ui-border));
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-activity-heading"] {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.75rem;
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-activity-heading"] > h3 {
        grid-column: 1 / -1;
        margin-bottom: 0;
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-activity-heading"] > div.grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 0.5rem;
        padding: 1rem;
        border: 1px solid rgb(var(--ui-border));
        border-radius: 8px;
        background: rgb(var(--ui-canvas));
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-activity-heading"] > div.grid > span:first-child {
        font-size: 0.875rem;
        line-height: 1.4;
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-activity-heading"] > div.grid > span:last-child {
        font-family: "Azeret Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 1.75rem;
        line-height: 1.25;
        font-weight: 600;
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-providers-heading"] > div.mb-3 {
        padding: 1rem;
        border-radius: 8px;
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-repositories-heading"] > #health-repos > div {
        margin-top: 0.75rem;
        padding: 0.75rem;
        border: 1px solid rgb(var(--ui-border));
        border-radius: 8px;
        background: rgb(var(--ui-canvas));
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-repositories-heading"] > #health-repos > div > span:first-child {
        color: rgb(var(--ui-text));
        font-weight: 600;
      }
      .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-providers-heading"] > div.mb-3 > div.grid {
        padding-top: 0.375rem;
        padding-bottom: 0.375rem;
      }
      @media (min-width: 640px) {
        .ui-safe-dialog > [role="dialog"] section[aria-labelledby="health-activity-heading"] {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
    <style id="katlab-changes-review-lanes">
      /* Changes Review Lanes: file-first hierarchy in normal grouped rows only. */
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] {
        display: grid;
        min-width: 0;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: 0.75rem;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell] {
        min-width: 0;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell="signal"] > span {
        flex-wrap: wrap;
        max-width: 100%;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell="body"] {
        display: grid;
        min-width: 0;
        gap: 0.375rem;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell="body"] > button:first-child,
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell="body"] > span:first-child {
        min-width: 0;
        width: 100%;
        font-size: 1rem;
        line-height: 1.5;
        font-weight: 500;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell="body"] > [data-review-cell="context"] {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.375rem 0.5rem;
        overflow-wrap: anywhere;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell="body"] > [data-review-cell="context"] > * {
        min-width: 0;
        max-width: 100%;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell="action"] {
        display: flex;
        min-width: 0;
        justify-content: flex-start;
        align-items: center;
      }
      #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell="action"] > button {
        margin-left: 0;
      }
      @media (min-width: 1024px) {
        #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] {
          grid-template-columns: minmax(0, 8rem) minmax(0, 1fr) max-content;
          gap: 1rem;
        }
        #root #main-content > div > .changes-workbench > section[aria-label="Grouped uncommitted changes"] .ui-work-list[data-reveal] > div.mt-4 > .ui-work-row > [data-review-ledger="true"] > [data-review-cell="action"] {
          justify-content: flex-end;
        }
      }
    </style>
    <title>KATLAB Tracking Monitor</title>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
